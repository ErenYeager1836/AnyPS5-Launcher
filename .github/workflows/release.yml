name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run Test Suite
      run: |
        python -m unittest discover tests -v

    - name: Package Release ZIP
      run: |
        python scripts/package_release.py ${{ github.ref_name }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/AnyPS5-Launcher-windows-*.zip
        name: AnyPS5 Launcher ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
