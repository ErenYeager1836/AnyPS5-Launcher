# AnyPS5 Controller, Keyboard and Mouse Input Configuration
# Format: Action = Type:Value
# deadzone_left = 14
# deadzone_right = 14

Cross = KEY:Return
Circle = KEY:Escape
Square = KEY:R
Triangle = KEY:F
L1 = KEY:Q
R1 = KEY:E
L2 = MOUSE:Right
R2 = MOUSE:Left
Options = KEY:Return
LeftStickUp = KEY:W
LeftStickLeft = KEY:A
LeftStickDown = KEY:S
LeftStickRight = KEY:D
ToggleFullscreen = KEY:F11
ToggleMouse = KEY:F1
